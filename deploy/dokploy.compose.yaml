x-blocia-deployment: 1

x-runtime: &runtime
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  frontend:
    <<: *runtime
    image: ${GHCR_IMAGE_PREFIX:?Define GHCR_IMAGE_PREFIX}-frontend:${RELEASE_TAG:?Define RELEASE_TAG}
    environment:
      BLOCIA_API_UPSTREAM: api:8000
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - application
      - dokploy-network
    cpus: "0.5"
    mem_limit: 128m
    pids_limit: 128
    stop_grace_period: 30s

  api:
    <<: *runtime
    image: ${GHCR_IMAGE_PREFIX:?Define GHCR_IMAGE_PREFIX}-api:${RELEASE_TAG:?Define RELEASE_TAG}
    environment:
      ENVIRONMENT: production
      RELEASE_TAG: ${RELEASE_TAG:?Define RELEASE_TAG}
      FRONTEND_URL: ${FRONTEND_URL:?Define FRONTEND_URL with the HTTPS domain}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?Define ACCESS_TOKEN_SECRET}
      BLOCIA_INFERENCE_URL: http://inference:8001
      BLOCIA_INFERENCE_TOKEN: ${BLOCIA_INFERENCE_TOKEN:?Define BLOCIA_INFERENCE_TOKEN}
      BLOCIA_INFERENCE_TIMEOUT_SECONDS: ${BLOCIA_INFERENCE_TIMEOUT_SECONDS:-300}
      DATABASE_URL: postgresql://${POSTGRES_USER:-blocia}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-blocia}
      BLOCIA_LOCK_MINUTES: ${BLOCIA_LOCK_MINUTES:-1440}
      BLOCIA_PRELOAD_CLASSIFIER: "0"
      BLOCIA_PRELOAD_LOCAL_CHAT: "0"
      BLOCIA_DEFAULT_GOOGLE_TOKEN: ${BLOCIA_DEFAULT_GOOGLE_TOKEN:-}
      BLOCIA_DEFAULT_GROQ_TOKEN: ${BLOCIA_DEFAULT_GROQ_TOKEN:-}
      BLOCIA_DEFAULT_OPENROUTER_TOKEN: ${BLOCIA_DEFAULT_OPENROUTER_TOKEN:-}
      BLOCIA_DEFAULT_OPENAI_TOKEN: ${BLOCIA_DEFAULT_OPENAI_TOKEN:-}
      BLOCIA_DEFAULT_ANTHROPIC_TOKEN: ${BLOCIA_DEFAULT_ANTHROPIC_TOKEN:-}
      BLOCIA_ENCRYPTION_KEY: ${BLOCIA_ENCRYPTION_KEY:?Define BLOCIA_ENCRYPTION_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_SESSION_SECRET: ${GOOGLE_SESSION_SECRET:-}
      GOOGLE_REGISTRATION_SECRET: ${GOOGLE_REGISTRATION_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      inference:
        condition: service_healthy
      database:
        condition: service_healthy
    networks:
      - application
    cpus: ${API_CPUS:-1.0}
    mem_limit: ${API_MEMORY_LIMIT:-512m}
    pids_limit: 256
    stop_grace_period: 45s

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blocia}
      POSTGRES_USER: ${POSTGRES_USER:-blocia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - database-data:/var/lib/postgresql/data
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blocia} -d ${POSTGRES_DB:-blocia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  inference:
    <<: *runtime
    image: ${GHCR_IMAGE_PREFIX:?Define GHCR_IMAGE_PREFIX}-inference:${RELEASE_TAG:?Define RELEASE_TAG}
    environment:
      ENVIRONMENT: production
      RELEASE_TAG: ${RELEASE_TAG:?Define RELEASE_TAG}
      BLOCIA_INFERENCE_TOKEN: ${BLOCIA_INFERENCE_TOKEN:?Define BLOCIA_INFERENCE_TOKEN}
      BLOCIA_ENABLE_LOCAL_CHAT: ${BLOCIA_ENABLE_LOCAL_CHAT:-0}
      BLOCIA_PREPARE_MODELS: ${BLOCIA_PREPARE_MODELS:-1}
      BLOCIA_PRELOAD_CLASSIFIER: "1"
      OMP_NUM_THREADS: ${INFERENCE_CPU_THREADS:-2}
      MKL_NUM_THREADS: ${INFERENCE_CPU_THREADS:-2}
    volumes:
      - inference-models:/app/models
    networks:
      - application
    cpus: ${INFERENCE_CPUS:-2.0}
    mem_limit: ${INFERENCE_MEMORY_LIMIT:-6g}
    pids_limit: 256
    stop_grace_period: 120s

volumes:
  database-data:
  inference-models:

networks:
  # Private service membership, with outgoing internet access for AI providers.
  application:
  dokploy-network:
    external: true
