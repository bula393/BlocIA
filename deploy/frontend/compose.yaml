x-blocia-deployment: 1
x-blocia-service: frontend

services:
  frontend:
    image: ${GHCR_IMAGE_PREFIX:?Define GHCR_IMAGE_PREFIX}-frontend:${RELEASE_TAG:?Define RELEASE_TAG}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      BLOCIA_API_UPSTREAM: ${BLOCIA_SERVICE_NAMESPACE:-blocia-prod}-api:8000
    expose:
      - "8080"
    networks:
      - application
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    cpus: ${FRONTEND_CPUS:-0.5}
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-128m}
    pids_limit: 128
    stop_grace_period: 30s

networks:
  application:
    name: ${BLOCIA_NETWORK_NAME:-blocia-production}
    external: true
  dokploy-network:
    external: true
