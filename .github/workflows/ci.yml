name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: blocia_test
          POSTGRES_USER: blocia_test
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blocia_test -d blocia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql://blocia_test:ci-only-postgres-password@localhost:5432/blocia_test
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: back/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Prepare backend test artifacts
        run: mkdir -p ../test-results
      - name: Run backend tests without downloading model weights
        run: python -m pytest --junitxml=../test-results/backend.xml
      - name: Upload backend results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: test-results/backend.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: front
    env:
      CI: 'true'
      PLAYWRIGHT_JUNIT_OUTPUT_FILE: ../test-results/e2e.xml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Report dependency advisories
        continue-on-error: true
        run: |
          mkdir -p ../test-results
          npm audit --json > ../test-results/dependencies.json
      - name: Run frontend tests
        run: npm test -- --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=junit --outputFile=../test-results/frontend.xml
      - name: Build frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify the personal quota flow on desktop and mobile
        run: npm run test:e2e -- tests/e2e/personal-quota.spec.ts --reporter=line,junit --trace=retain-on-failure
      - name: Upload frontend results and browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: |
            test-results/frontend.xml
            test-results/e2e.xml
            test-results/dependencies.json
            front/test-results/
            front/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  containers:
    name: Container builds and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACCESS_TOKEN_SECRET: ci-placeholder-signing-secret-not-for-production-000000000
      BLOCIA_INFERENCE_TOKEN: ci-placeholder-inference-token-not-for-production
      FRONTEND_URL: http://localhost:8080
      DATABASE_URL: postgresql://blocia:ci-only-postgres-password@database:5432/blocia
      POSTGRES_PASSWORD: ci-only-postgres-password
      BLOCIA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GHCR_IMAGE_PREFIX: ghcr.io/example/blocia
      RELEASE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install YAML validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate deployment contracts
        run: python scripts/validate_deployment.py
      - name: Validate local Compose
        run: docker compose -f compose.yaml config --quiet
      - name: Validate all-in-one Dokploy alternative
        run: docker compose -f deploy/dokploy.compose.yaml config --quiet
      - name: Validate separate Dokploy services
        run: |
          docker compose -f deploy/inference/compose.yaml config --quiet
          docker compose -f deploy/api/compose.yaml config --quiet
          docker compose -f deploy/frontend/compose.yaml config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build frontend container
        uses: docker/build-push-action@v7
        with:
          context: ./front
          file: ./front/Dockerfile
          push: false
          load: true
          tags: blocia-ci-frontend:${{ github.sha }}
          build-args: RELEASE_TAG=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build API container
        uses: docker/build-push-action@v7
        with:
          context: ./back
          file: ./back/Dockerfile
          target: api
          push: false
          load: true
          tags: blocia-ci-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Verify startup order and API DNS recovery
        shell: bash
        run: bash scripts/smoke_containers.sh
      - name: Remove smoke test containers
        if: always()
        shell: bash
        run: bash scripts/smoke_containers.sh --cleanup
