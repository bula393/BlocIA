[project]
name = "bloc-ia-user-module"
version = "0.1.0"
description = "BlocIA user module backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "email-validator>=2.1.0",
    "PyYAML>=6.0.0",
    "cryptography>=44"
]

[project.optional-dependencies]
local = [
    "torch>=2.6",
    "sentence-transformers>=3.4,<6",
    "transformers>=4.51,<5",
    "scikit-learn>=1.5,<2",
    "huggingface-hub>=0.30,<1"
]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ml*"]

[tool.setuptools.package-data]
"app.infrastructure" = ["schema.sql", "user/migrations/*.sql"]
